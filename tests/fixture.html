<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề Thi FE - AIG202c - SU26 - FE | FuOverflow Community</title><style>body{margin:0;background:#09090b;color:#fafafa;font-family:system-ui,sans-serif}dialog{margin:0;width:100vw;height:100dvh;max-width:none;max-height:none;border:0;padding:0;background:#000;color:#fff}.fuo-layout{display:flex;width:100%;height:100%}.fuo-stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px}.fuo-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}.fuo-img-wrap{flex:1;min-height:0;display:grid;place-items:center}.fuo-img-wrap img{max-width:100%;max-height:100%}.fuo-thumbs{display:flex;gap:6px;list-style:none;margin:8px 0 0;padding:0;overflow-x:auto}.fuo-thumbs button{width:48px;height:48px;border:1px solid #3f3f46;border-radius:6px;background:#18181b;color:#fafafa;cursor:pointer}.fuo-aside{width:360px;max-width:100vw;height:100%;overflow-y:auto;background:#18181b;color:#fafafa;border-left:1px solid #27272a;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}.fuo-poll-opts{display:grid;gap:6px}.fuo-poll-btn{position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 6px;border-radius:8px;border:1px solid #3f3f46;background:transparent;color:#fafafa;cursor:pointer;overflow:hidden}.fuo-poll-fill{position:absolute;inset:0 auto 0 0;width:100%;z-index:-1;background:#3f3f46;transform-origin:left}.fuo-poll-letter{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#27272a;font-weight:700}.fuo-poll-stats{margin-left:auto;display:flex;gap:8px;font-variant-numeric:tabular-nums}.fuo-comments-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.fuo-comment-bubble{background:#27272a;border-radius:14px;padding:8px 12px}.fuo-pinned-ai{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px 12px}.fuo-composer{border-top:1px solid #27272a;padding-top:10px}.tiptap{min-height:36px;padding:8px 12px;border-radius:14px;background:#27272a}</style><body><script>(opts => {
    const store = { deepseekKey: opts.key || '' };
    window.saved = store; window.gmStore = store; window.calls = 0; window.ocrCalls = 0;
    window.menuCommands = {};
    window.GM_addStyle = css => { const s = document.createElement('style'); s.textContent = css; document.head.append(s); };
    window.GM_getResourceText = () => '';
    window.GM_getValue = (key, value) => Object.prototype.hasOwnProperty.call(store, key) ? store[key] : value;
    window.GM_setValue = (key, value) => { store[key] = value; };
    window.GM_registerMenuCommand = (name, fn) => { window.menuCommands[name] = fn; };
    window.fetch = async () => ({ ok: true, blob: async () => new Blob(['test'], { type: 'image/png' }) });
    window.GM_xmlhttpRequest = args => {
      window.calls++;
      const method = (args.method || 'POST').toUpperCase();
      const url = String(args.url || '');
      const headers = args.headers || {};
      const isModels = method === 'GET' && /\/models$/i.test(url);
      const isGemini = url.includes(':generateContent') || url.includes('generativelanguage.googleapis.com') || Boolean(headers['x-goog-api-key']);
      const isAnthropic = url.endsWith('/messages') || url.includes('anthropic') || Boolean(headers['x-api-key']);
      const isDeepSeek = url.includes('deepseek');
      setTimeout(() => {
        if (opts.aiError) {
          args.onload({ status: 500, responseText: JSON.stringify({ error: { message: 'Mock AI error' } }) });
          return;
        }
        if (isModels) {
          let payload;
          if (isGemini) {
            payload = { models: [{ name: 'models/gemini-2.5-flash', displayName: 'Gemini 2.5 Flash', supportedGenerationMethods: ['generateContent'] }, { name: 'models/gemini-2.5-pro', displayName: 'Gemini 2.5 Pro', supportedGenerationMethods: ['generateContent'] }] };
          } else if (isAnthropic) {
            payload = { data: [{ id: 'claude-sonnet-4-5', display_name: 'Claude Sonnet 4.5' }, { id: 'claude-3-5-haiku', display_name: 'Claude 3.5 Haiku' }] };
          } else if (isDeepSeek) {
            payload = { data: [{ id: 'deepseek-flash', name: 'DeepSeek Flash' }, { id: 'deepseek-chat', name: 'DeepSeek Chat' }, { id: 'deepseek-reasoner', name: 'DeepSeek Reasoner' }] };
          } else {
            payload = { data: [{ id: 'gpt-4.1-mini', name: 'GPT-4.1 Mini' }, { id: 'gpt-4o', name: 'GPT-4o' }, { id: 'o4-mini', name: 'o4-mini' }] };
          }
          args.onload({ status: 200, responseText: JSON.stringify(payload) });
          return;
        }
        const solutionJson = JSON.stringify({
          answer: opts.ai || 'AC',
          explanation: 'Các phương án này thỏa mãn điều kiện của câu hỏi.'
        });
        let responseBody;
        if (isGemini) responseBody = { candidates: [{ content: { parts: [{ text: solutionJson }] } }] };
        else if (isAnthropic) responseBody = { content: [{ type: 'text', text: solutionJson }] };
        else responseBody = { choices: [{ message: { content: solutionJson } }] };
        args.onload({ status: 200, responseText: JSON.stringify(responseBody) });
      }, opts.aiDelay || 0);
    };
    window.Tesseract = { createWorker: async () => ({ recognize: async () => { window.ocrCalls++; await new Promise(r => setTimeout(r, opts.ocrDelay || 0)); if (opts.ocrError) throw Error('OCR'); return { data: { text: opts.text || 'Select one answer' } }; }, terminate: async () => {} }) };
    const mockImageUrl = URL.createObjectURL(new Blob([Uint8Array.from(atob('R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'), c => c.charCodeAt(0))], { type: 'image/gif' }));

    function buildPollSection(spec) {
      const sec = document.createElement('section');
      sec.setAttribute('aria-label', 'Bình chọn đáp án');
      const totalVoters = spec.totalVoters ?? 2;
      const counts = { ...(spec.counts || { A: 2, B: 0, C: 0, D: 0 }) };
      const pressedSet = new Set(spec.pressed || []);
      let multiOn = Boolean(spec.multiOn);

      const header = document.createElement('header');
      header.innerHTML = '<div><h2>Bình chọn đáp án</h2><p><span class="font-num">' + totalVoters + '</span> người đã chọn</p></div>';
      const sw = document.createElement('button');
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', String(multiOn));
      sw.textContent = 'Nhiều đáp án';
      sw.onclick = () => { multiOn = !multiOn; sw.setAttribute('aria-checked', String(multiOn)); };
      header.append(sw);

      const group = document.createElement('div');
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', 'Các phương án');
      group.className = 'fuo-poll-opts';

      function renderOptions() {
        group.replaceChildren();
        const denom = Math.max(1, Number(header.querySelector('p .font-num')?.textContent || totalVoters || 1));
        for (const key of Object.keys(counts)) {
          const count = counts[key];
          const pct = Math.round((count / denom) * 100);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'fuo-poll-btn';
          btn.setAttribute('aria-pressed', String(pressedSet.has(key)));
          btn.setAttribute('aria-label', 'Phương án ' + key + ', ' + count + ' người chọn, ' + pct + '%');
          btn.innerHTML =
            '<span aria-hidden="true" class="fuo-poll-fill" style="transform: scaleX(' + (pct / 100) + ');"></span>' +
            '<span aria-hidden="true" class="fuo-poll-letter">' + key + '</span>' +
            '<span aria-hidden="true"></span>' +
            '<span aria-hidden="true" class="fuo-poll-stats"><span>' + count + '</span><span>' + pct + '%</span></span>';
          btn.onclick = () => {
            const was = pressedSet.has(key);
            if (!multiOn) {
              for (const k of [...pressedSet]) {
                pressedSet.delete(k);
                counts[k] = Math.max(0, counts[k] - 1);
              }
              if (!was) {
                pressedSet.add(key);
                counts[key] = (counts[key] || 0) + 1;
              }
            } else {
              if (was) { pressedSet.delete(key); counts[key] = Math.max(0, counts[key] - 1); }
              else { pressedSet.add(key); counts[key] = (counts[key] || 0) + 1; }
            }
            const nextVoters = pressedSet.size > 0 && !(spec.pressed || []).length ? totalVoters + 1 : totalVoters;
            header.querySelector('p .font-num').textContent = String(nextVoters);
            renderOptions();
          };
          group.append(btn);
        }
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.textContent = '+ Thêm phương án';
        group.append(addBtn);
      }
      renderOptions();
      sec.append(header, group);
      return sec;
    }

    function buildCommentsBlock(spec) {
      const wrap = document.createElement('div');
      wrap.innerHTML = '<div><h2>Bình luận · ' + (spec.comments?.length || 0) + '</h2></div>';
      if (spec.fuoAi) {
        const aiCard = document.createElement('div');
        aiCard.className = 'fuo-pinned-ai';
        aiCard.innerHTML = '<div><strong>FUO AI</strong></div><div class="rich-text"></div><div>Đã ghim</div>';
        aiCard.querySelector('.rich-text').textContent = spec.fuoAi;
        wrap.append(aiCard);
      }
      const ul = document.createElement('ul');
      ul.setAttribute('aria-label', 'Bình luận');
      ul.className = 'fuo-comments-list';
      for (const [i, item] of (spec.comments || []).entries()) {
        const li = document.createElement('li');
        li.id = 'media-comment-' + i;
        const author = typeof item === 'string' ? 'user' + i : item.author;
        const text = typeof item === 'string' ? item : item.text;
        li.innerHTML = '<div class="fuo-comment-bubble"><a href="/u/' + author + '">' + author + '</a><div class="rich-text"><p></p></div></div>';
        li.querySelector('.rich-text p').textContent = text;
        ul.append(li);
      }
      wrap.append(ul);
      const comp = document.createElement('div');
      comp.className = 'fuo-composer';
      comp.innerHTML = '<div contenteditable="true" role="textbox" aria-multiline="true" aria-label="Viết bình luận về ảnh này" class="tiptap ProseMirror"><p></p></div>';
      wrap.append(comp);
      return wrap;
    }

    const slides = [
      { index: 1, total: 2, counts: { A: 2, B: 0, C: 0, D: 0 }, totalVoters: 2, fuoAi: 'Đáp án: A\nLarge language models sử dụng mạng nơ-ron huấn luyện trên tập dữ liệu lớn.', comments: ['A'] },
      { index: 2, total: 2, counts: { A: 0, B: 3, C: 0, D: 0 }, totalVoters: 3, fuoAi: 'Đáp án: B\nPhương án B mô tả đúng nhất.', comments: ['B'] }
    ];

    window.setSlide = spec => {
      document.querySelector('dialog')?.remove();
      const index = spec.index || 1;
      const total = spec.total || 2;
      const mediaPath = spec.mediaPath || ('/media/q' + index + '-webp.' + (138416 + index) + '/');
      const dlg = document.createElement('dialog');
      dlg.open = true;
      dlg.setAttribute('aria-label', 'Ảnh trong bài #1');
      dlg.innerHTML =
        '<div class="fuo-layout">' +
          '<div class="fuo-stage">' +
            '<div class="fuo-topbar"><p aria-live="polite">' + index + ' / ' + total + '</p><a aria-label="Mở trang ảnh" href="' + mediaPath + '">Mở trang ảnh</a></div>' +
            '<div class="fuo-img-wrap"><img data-lightbox-img="" alt="Ảnh ' + index + ' trên ' + total + '"></div>' +
            '<nav aria-label="Ảnh thu nhỏ"><ol class="fuo-thumbs"></ol></nav>' +
          '</div>' +
          '<aside aria-label="Thảo luận về ảnh" class="fuo-aside">' +
            '<div><div><a href="/u/ngochoa87">ngochoa87</a><p>16/08 · Ảnh ' + index + '/' + total + '</p></div><p>Bài viết gốc: <a href="/threads/aig202c-su26-fe.7263/#post-1">Đề Thi FE - AIG202c - SU26 - FE</a></p></div>' +
          '</aside>' +
        '</div>';
      dlg.querySelector('img').src = spec.imgSrc || mockImageUrl;
      const ol = dlg.querySelector('nav[aria-label="Ảnh thu nhỏ"] ol');
      for (let i = 1; i <= total; i++) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Ảnh ' + i);
        if (i === index) b.setAttribute('aria-current', 'true');
        b.textContent = String(i);
        b.onclick = () => window.setSlide(slides[i - 1] || { index: i, total });
        li.append(b);
        ol.append(li);
      }
      const aside = dlg.querySelector('aside');
      aside.append(buildPollSection(spec), buildCommentsBlock(spec));
      document.body.append(dlg);
    };

    window.setSlide(slides[0]);
  })({ key: '' })</script><script src="/fuo-reui.user.js"></script>

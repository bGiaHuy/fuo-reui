<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>FUO reUI</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      width: 280px;
      background: #18181b;
      color: #fafafa;
      font: 500 13px/1.45 system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 650;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ver {
      font-size: 11px;
      color: #a1a1aa;
      font-weight: 500;
    }
    .hint {
      color: #a1a1aa;
      font-size: 12px;
      margin: 0 0 10px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      background: #27272a;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: #3f3f46;
      border-color: #71717a;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>FUO reUI <span class="ver">v3.0.0</span></h1>
  <p class="hint" id="hint">Đang kiểm tra tab hiện tại…</p>
  <div class="list" id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
